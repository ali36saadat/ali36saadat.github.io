---
layout: default
---

<div class="post">
  <span>
    <img src="{{ page.image | relative_url }}" alt="Ali Saadat" class="post-img">
  </span>
  <h1 class="post-title">{{ page.title }}</h1>
  <div class="post-excerpt">{{ page.excerpt }}</div>
  <span class="post-date">{{ page.date | date_to_string }}</span>
  
  {{ content }}

  {% include footer.html %}

</div>

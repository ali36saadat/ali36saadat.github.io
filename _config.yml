# Setup
title: "Ali Saadat"
description: "Personal Website"
url: "https://ali36saadat.github.io"
baseurl: ""

author:
  name: 'Ali Saadat'

# Gems
plugins:
  - jekyll-gist
  - jekyll-toc
  - jekyll-paginate

collections:
  pages:
    output: true
    permalink: /:categories/:slug/

permalink: /:categories/:title/

defaults:
  - scope:
      path: "assets/img"
    values:
      image: true

toc:
  min_level: 2
  max_level: 3

version:  3.0.0


name: Sync Project READMEs to Posts

on:
  repository_dispatch:
    types: [update-project-post]

  workflow_dispatch:
    inputs:
      repo:
        description: "Source repository (owner/repo)"
        required: true
        type: string
      post:
        description: "Target post path"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: sync-project-posts
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve source and target
        id: config
        env:
          EVENT_REPO: ${{ github.event.client_payload.repo }}
          EVENT_POST: ${{ github.event.client_payload.post }}
          INPUT_REPO: ${{ inputs.repo }}
          INPUT_POST: ${{ inputs.post }}
        run: |
          REPO="${EVENT_REPO:-$INPUT_REPO}"
          POST="${EVENT_POST:-$INPUT_POST}"

          if [[ ! "$REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "Invalid repository"
            exit 1
          fi

          if [[ ! "$POST" =~ ^_posts/[A-Za-z0-9._/-]+\.md$ ]] ||
             [[ "$POST" == *..* ]]; then
            echo "Invalid post path"
            exit 1
          fi

          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "post=$POST" >> "$GITHUB_OUTPUT"

      - name: Checkout website
        uses: actions/checkout@v4

      - name: Download source README
        env:
          REPO: ${{ steps.config.outputs.repo }}
        run: |
          BRANCH=$(curl -fsSL \
            "https://api.github.com/repos/$REPO" |
            jq -r '.default_branch')

          test -n "$BRANCH" && test "$BRANCH" != "null"

          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/$REPO/$BRANCH/README.md" \
            --output /tmp/project-readme.md


      - name: Update post body
        env:
          POST: ${{ steps.config.outputs.post }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          post = Path(os.environ["POST"])
          readme = Path("/tmp/project-readme.md").read_text(
              encoding="utf-8"
          )

          if not post.is_file():
              raise SystemExit(f"Post not found: {post}")

          content = post.read_text(encoding="utf-8")

          # Match the opening and closing Jekyll front matter delimiters.
          match = re.match(
              r"\A---[ \t]*\r?\n.*?^---[ \t]*(?:\r?\n|\Z)",
              content,
              flags=re.DOTALL | re.MULTILINE,
          )

          if not match:
              raise SystemExit(
                  "Could not parse Jekyll front matter in " + str(post)
              )

          front_matter = match.group(0)
          body = readme.lstrip("\r\n")

          readme_title = None
          heading_match = re.match(r"\A[ \t]*#[ \t]+([^\r\n]+)\r?\n?", body)
          if heading_match:
              readme_title = heading_match.group(1).strip()
              body = body[heading_match.end():].lstrip("\r\n")

          readme_image = None
          image_match = re.match(
              r'''\A\s*<a\b[^>]*>\s*<img\b[^>]*\bsrc=["'](?P<image>[^"']+)["'][^>]*>\s*</a>[ \t]*(?:\r?\n|$)''',
              body,
              flags=re.IGNORECASE,
          )
          if image_match:
              readme_image = image_match.group("image")
              body = body[image_match.end():].lstrip("\r\n")

          for field, value in (("title", readme_title), ("image", readme_image)):
              if not value:
                  continue

              field_pattern = re.compile(
                  rf"(?m)^([ \t]*{re.escape(field)}:[ \t]*)(.*?)[ \t]*$"
              )
              field_match = field_pattern.search(front_matter)
              if not field_match:
                  continue

              current_value = field_match.group(2)
              if current_value.startswith('"'):
                  try:
                      current_value = json.loads(current_value)
                  except json.JSONDecodeError:
                      current_value = current_value.strip('"')
              elif current_value.startswith("'"):
                  current_value = current_value[1:-1].replace("''", "'")
              else:
                  current_value = current_value.split(" #", 1)[0].strip()

              if value != current_value:
                  front_matter = field_pattern.sub(
                      lambda field_match: field_match.group(1)
                      + json.dumps(value, ensure_ascii=False),
                      front_matter,
                      count=1,
                  )

          updated = front_matter + "\n" + body

          if updated != content:
              post.write_text(updated, encoding="utf-8")
              print(f"Updated post body: {post}")
          else:
              print("No changes detected.")
          PY

      - name: Commit and push
        env:
          POST: ${{ steps.config.outputs.post }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- "$POST"

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "docs: sync project README to post"
          git push

<div class="sidebar" style="--sidebar-color: {{ page.color | default: '#141414' }};">


  <div class="container sidebar-toc">
    <span>Content</span>
    {% if page.layout == "post" %}
      {% toc %}
    {% endif %}
  </div>


  <input type="checkbox" id="sidebar-toggle" class="sidebar-toggle">
  <label for="sidebar-toggle" class="sidebar-toggle-button" aria-label="Toggle sidebar">
      ☰
  </label>

  <div class="container sidebar-sticky">
    <div class="sidebar-about">
      <h1>
          {{ site.title }}
      </h1>
    </div>

    <nav class="sidebar-nav">
      <a
        class="sidebar-nav-item{% if page.url == '/' %} active{% endif %}"
        href="{{ '/' | relative_url }}">
        Home
      </a>

      <a
        class="sidebar-nav-item{% if page.url == '/repositories/' %} active{% endif %}"
        href="{{ '/repositories/' | relative_url }}">
        Repositories
      </a>

      <a
        class="sidebar-nav-item{% if page.url == '/posts/' or page.url contains '/posts/' %} active{% endif %}"
        href="{{ '/posts/' | relative_url }}">
        Posts
      </a>
    </nav>
  </div>
</div>

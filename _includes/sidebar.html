<div class="sidebar">
  <div class="mobile-sidebar-controls">
    <details class="mobile-disclosure mobile-site-menu" name="mobile-sidebar">
      <summary class="mobile-control mobile-site-toggle">≡ {{ site.title }}</summary>
      <nav class="mobile-menu-panel" aria-label="Main navigation">
        <a class="sidebar-nav-item{% if page.url == '/' %} active{% endif %}" href="{{ '/' | relative_url }}">Home</a>
        <a class="sidebar-nav-item{% if page.url == '/repositories/' %} active{% endif %}" href="{{ '/repositories/' | relative_url }}">Repositories</a>
        <a class="sidebar-nav-item{% if page.url == '/posts/' or page.url contains '/posts/' %} active{% endif %}" href="{{ '/posts/' | relative_url }}">Posts</a>
      </nav>
    </details>
    {% if page.layout == "post" %}
      <details class="mobile-disclosure mobile-toc-menu" name="mobile-sidebar">
        <summary class="mobile-control mobile-toc-toggle">Content ≡</summary>
        <div class="mobile-toc-panel">
          {% toc %}
        </div>
      </details>
    {% endif %}
  </div>

  <div class="sidebar-sticky">
    <nav class="sidebar-nav" id="site-navigation">
      <div class="sidebar-about">
        <h1>
          {{ site.title }}
        </h1>
      </div>
      <a
        class="sidebar-nav-item{% if page.url == '/' %} active{% endif %}"
        href="{{ '/' | relative_url }}">
        Home
      </a>

      <a
        class="sidebar-nav-item{% if page.url == '/repositories/' %} active{% endif %}"
        href="{{ '/repositories/' | relative_url }}">
        Repositories
      </a>

      <a
        class="sidebar-nav-item{% if page.url == '/posts/' or page.url contains '/posts/' %} active{% endif %}"
        href="{{ '/posts/' | relative_url }}">
        Posts
      </a>
    </nav>


    {% if page.layout == "post" %}
      <nav class="sidebar-toc">
        <h1 class="sidebar-toc-title">Content</h1>
        {% toc %}
      </nav>
    {% endif %}
  </div>
</div>
